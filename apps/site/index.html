<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="quanto turns messy human text into well-typed values and back.">
<title>quanto</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="quanto.css">
<style>
  body { align-items: center; }
  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 24px;
    text-align: center;
  }
  .mark-button { margin: 0 0 36px; padding: 0; border: 0; background: none; cursor: pointer; }
  .mark { width: clamp(131px, 19.6vw, 183px); height: auto; }
  .mark-button:hover .face { transform: translate(-0.5px, -0.5px); }
  .mark-button:hover .mark.pressed .face, .mark.pressed .face { transform: translate(2px, 2px); }
  h1 { margin: 0; font: 700 clamp(40px, 7vw, 56px)/1 var(--sans); letter-spacing: -0.06em; }
  .lede { margin: 14px 0 0; color: var(--muted); font-size: 17px; }

  /* One example at a time, typed then parsed. Aligned on the arrow so nothing jumps. */
  .ticker {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    gap: 16px;
    width: min(980px, 100%);
    min-height: 1.6em;
    margin: 56px 0 52px;
    font: 15px/1.6 var(--mono);
    text-decoration: none;
  }
  .ticker .raw { justify-self: end; white-space: pre; }
  .ticker .raw::after {
    content: '';
    display: inline-block;
    width: 0.55em;
    height: 1.1em;
    margin-left: 2px;
    vertical-align: -0.2em;
    background: var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  .ticker.done .raw::after { visibility: hidden; }
  .ticker .arrow { color: var(--shade); }
  .ticker .value { justify-self: start; text-align: left; white-space: nowrap; opacity: 0; transition: opacity 120ms; }
  .ticker.done .value { opacity: 1; }
  .ticker .codec { color: var(--muted); }
  .ticker:hover .raw { text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--shade); }
  @keyframes blink { 50% { visibility: hidden; } }

  footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 28px;
    color: var(--muted);
    font: 12px/1.5 var(--mono);
  }
  footer nav { display: flex; gap: 20px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .ticker { grid-template-columns: 1fr; gap: 4px; text-align: center; }
    .ticker .raw, .ticker .value { justify-self: center; text-align: center; white-space: normal; }
    .ticker .codec { display: none; }
    .ticker .arrow { transform: rotate(90deg); }
    footer { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body class="grid-bg">
<main>
  <button class="mark-button" id="mark-button" type="button" aria-label="quanto mark. Click to change the glyph.">
    <svg class="mark" id="mark" viewBox="8 3 48 60" aria-hidden="true">
      <path class="shade" d="M30 6h6l2 2v6l-2 2h-6l-2-2V8zM30 22h6l2 2v10l-2 2H24l-2 2v6l2 2h14l2-2v-6l2-2h6l2 2v14l-4 4H16l-4-4V30l4-4h12v-2z"/>
      <path class="face" d="M30 6h6l2 2v6l-2 2h-6l-2-2V8zM30 22h6l2 2v10l-2 2H24l-2 2v6l2 2h14l2-2v-6l2-2h6l2 2v14l-4 4H16l-4-4V30l4-4h12v-2z"/>
    </svg>
  </button>
  <h1>quanto</h1>
  <p class="lede">A forgiving and flexible input parser and formatter.</p>

  <a class="ticker" id="ticker" href="play/index.html" aria-label="Try an example in the playground">
    <span class="raw" id="raw"></span>
    <span class="arrow">→</span>
    <span class="value"><code id="value"></code> <span class="codec" id="codec"></span></span>
  </a>

  <a class="btn" href="demo/index.html">Open the playground <span aria-hidden="true">→</span></a>
</main>
<footer>
  <span>pre-release · lengths, weights, durations, money, dates</span>
  <nav>
    <code>npm i quanto</code>
    <a href="https://github.com/endograph/quanto">GitHub</a>
  </nav>
</footer>

<script type="module" src="landing.js"></script>
</body>
</html>
