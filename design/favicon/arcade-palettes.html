<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nine color palettes for the Quanto Arcade favicon.">
  <title>Quanto · Arcade palettes</title>
  <link id="favicon" rel="icon" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #222830; background: #eef0f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: auto; padding: 32px; }
    header { margin-bottom: 24px; }
    .eyebrow { font: 12px/1.5 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .12em; color: #536072; margin: 0 0 6px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); font-weight: 650; letter-spacing: -.04em; }
    header p:last-child { margin: 8px 0 0; color: #616c78; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    article { background: white; border: 1px solid #d9dfe6; border-radius: 12px; overflow: hidden; }
    .stage { position: relative; height: 176px; display: grid; place-items: center; background: var(--paper); color: var(--face); }
    .stage > svg { width: 128px; height: 128px; }
    .number { position: absolute; left: 18px; top: 14px; font: 12px ui-monospace, monospace; }
    .content { padding: 18px; }
    h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .note { margin: 4px 0 16px; color: #616c78; font-size: 14px; min-height: 42px; }
    .sizes { display: flex; gap: 26px; align-items: end; margin: 16px 0 20px; }
    .size { display: flex; flex-direction: column; gap: 7px; align-items: center; }
    .size span { font: 12px ui-monospace, monospace; color: #616c78; }
    svg { display: block; flex-shrink: 0; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 9px; background: #f1f3f5; border: 1px solid #e0e4e9; border-radius: 6px; font-size: 12px; color: #344050; }
    .tab.dark { background: #252a32; border-color: #252a32; color: #ecf0f5; }
    .swatches { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    .swatch { font: 12px/1.5 ui-monospace, monospace; color: #536072; }
    .swatch > span { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 1px solid #0002; }
    .swatch small { display: block; font: 12px/1.5 system-ui, sans-serif; color: #616c78; }
    button { font: 14px system-ui, sans-serif; border: 1px solid #cbd3dc; background: white; color: #26384e; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    button[aria-pressed="true"] { background: #26384e; color: white; border-color: #26384e; }
    button:focus-visible { outline: 3px solid #3979bf; outline-offset: 3px; }
    footer { margin-top: 24px; color: #616c78; font-size: 14px; }
    footer a { color: #264b7c; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { main { padding: 24px 16px; } .grid { grid-template-columns: 1fr; } .note { min-height: 0; } }
    @media print { main { padding: 0; } article { break-inside: avoid; } button { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">quanto / arcade ¿</p>
      <h1>Same mark. Nine moods.</h1>
      <p>Clipped corners, even strokes, and the close offset shadow. Only the colors change.</p>
    </header>
    <div class="grid" id="grid"></div>
    <footer>Actual 16 / 32 / 64px samples and light / dark tab previews. <a href="four-directions.html">Back to the shape explorations</a>.</footer>
  </main>
  <script>
    const path = 'M30 6h6l2 2v6l-2 2h-6l-2-2V8zM30 22h6l2 2v10l-2 2H24l-2 2v6l2 2h14l2-2v-6l2-2h6l2 2v14l-4 4H16l-4-4V30l4-4h12v-2z';
    const palettes = [
      { name: 'Ink & cream', face: '#183C72', shadow: '#8A9DB7', paper: '#FAF7F0', note: 'The original. Quiet, precise, and a little bookish.' },
      { name: 'Cobalt & lemon', face: '#2452E6', shadow: '#112A85', paper: '#FFE978', note: 'Bright and graphic. My pick for a playful Quanto.' },
      { name: 'Brick & butter', face: '#B73529', shadow: '#712921', paper: '#FFF0C2', note: 'Warm, nostalgic, and close to an old game cartridge.' },
      { name: 'Coin gold', face: '#FFD34E', shadow: '#A96A20', paper: '#242936', note: 'The strongest arcade nod. A gold mark on charcoal.' },
      { name: 'Mint terminal', face: '#82F5B2', shadow: '#347A65', paper: '#123C32', note: 'Fresh and technical, with a late-night terminal feel.' },
      { name: 'Violet punch', face: '#6028C9', shadow: '#B091DB', paper: '#F0E5FF', note: 'A softer backdrop with a sharp, saturated mark.' },
      { name: 'Safety orange', face: '#FF863D', shadow: '#A74824', paper: '#142E4A', note: 'Bold contrast. An orange instrument on deep navy.' },
      { name: 'Electric lime', face: '#D5FA47', shadow: '#728B31', paper: '#252B37', note: 'Punchy and contemporary. A tiny signal in the tab bar.' },
      { name: 'Graphite', face: '#242424', shadow: '#969696', paper: '#F7F7F5', note: 'Restrained and durable. Lets the silhouette do the work.' }
    ];
    function svg(palette, size, withBackground = true) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">${withBackground ? `<path fill="${palette.paper}" d="M0 0h64v64H0z"/>` : ''}<path fill="${palette.shadow}" transform="translate(2 2)" d="${path}"/><path fill="${palette.face}" d="${path}"/></svg>`;
    }
    document.getElementById('grid').innerHTML = palettes.map((palette, index) => `
      <article style="--paper:${palette.paper};--face:${palette.face}">
        <div class="stage"><span class="number">0${index + 1}</span>${svg(palette, 128, false)}</div>
        <div class="content">
          <h2>${palette.name}</h2><p class="note">${palette.note}</p>
          <div class="sizes">${[16, 32, 64].map(size => `<div class="size">${svg(palette, size)}<span>${size}px</span></div>`).join('')}</div>
          <div class="tabs"><div class="tab">${svg(palette, 16)}<span>quanto</span></div><div class="tab dark">${svg(palette, 16)}<span>quanto</span></div></div>
          <div class="swatches">${[['face', 'Mark'], ['shadow', 'Shadow'], ['paper', 'Background']].map(([key, label]) => `<div class="swatch"><small>${label}</small><span style="background:${palette[key]}"></span>${palette[key]}</div>`).join('')}</div>
          <button data-palette="${index}" aria-pressed="false" aria-label="Preview ${palette.name} in this tab">Preview in this tab</button>
        </div>
      </article>`).join('');
    function selectPalette(index) {
      const palette = palettes[index];
      document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg(palette, 64));
      document.title = 'Quanto · ' + palette.name;
      document.querySelectorAll('button[data-palette]').forEach(button => {
        const selected = Number(button.dataset.palette) === index;
        button.setAttribute('aria-pressed', String(selected));
        button.textContent = selected ? 'Previewing in this tab' : 'Preview in this tab';
      });
    }
    document.querySelectorAll('button[data-palette]').forEach(button => button.addEventListener('click', () => selectPalette(Number(button.dataset.palette))));
    selectPalette(0);
  </script>
</body>
</html>
