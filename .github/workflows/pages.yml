# Builds apps/site and publishes it to GitHub Pages. The site bundles the packages
# from source, so it redeploys when they change too.
name: Pages

on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'packages/quanto/src/**', 'packages/common/src/**', 'packages/datetime/src/**', 'bun.lock', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quantojs/site build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
