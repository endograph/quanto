# Publishes quanto and every @quantojs package to npm when a version tag is pushed (v0.1.0). The
# packages release in lockstep: the tag must match their shared version. Tarballs are packed with bun (which
# rewrites workspace: ranges) and published with npm, with provenance.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Check the tag matches the packages' version
        run: |
          version=$(node -p "require('./packages/quanto/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package version $version." >&2
            exit 1
          fi
      - run: bun scripts/pack.ts "$RUNNER_TEMP/packs"
      - run: |
          for t in "$RUNNER_TEMP"/packs/*.tgz; do
            bunx publint@0.3.24 "$t"
            bunx @arethetypeswrong/cli@0.18.5 "$t" --profile esm-only
          done
      # quanto first: the other packages' peer dependency points at it. @quantojs/anything last: it depends
      # on the codec packages.
      - run: |
          version=$(node -p "require('./packages/quanto/package.json').version")
          for name in quanto quantojs-common quantojs-datetime quantojs-geo quantojs-music quantojs-sizes \
            quantojs-libphonenumber quantojs-libpostal quantojs-react quantojs-anything; do
            npm publish "$RUNNER_TEMP/packs/$name-$version.tgz" --provenance --access public
          done
